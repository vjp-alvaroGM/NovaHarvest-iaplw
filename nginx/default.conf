# redirigir las peticiones http a https
server {
    listen 80;
    server_name localhost;

    return 301 https://$host:8443$request_uri;
}

# servir la web mediante https
server {
    listen 443 ssl;
    server_name localhost;

    # certificado y clave privada
    ssl_certificate /etc/nginx/certs/novaharvest.crt;
    ssl_certificate_key /etc/nginx/certs/novaharvest.key;

    # carpeta de la aplicación y páginas de inicio
    root /usr/share/nginx/html;
    index index.php index.html;

    # tamaño máximo del cuerpo de una petición
    client_max_body_size 64k;

    # errores de página no encontrada
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # errores del servidor
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }

    # compresión de respuestas
    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 256;

    # markdown como texto utf-8
    location ~* \.md$ {
        types { }
        default_type "text/plain; charset=utf-8";
    }

    # ejecución del código php
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}