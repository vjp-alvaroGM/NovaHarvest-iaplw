services:
  # servidor web con http y https
  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      # contenido, configuración y certificados
      - ./web:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - php

  # servicio que ejecuta el código php
  php:
    build: ./php
    volumes:
      # archivos compartidos con nginx
      - ./web:/usr/share/nginx/html:ro
      - ./php/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro
      - ./php/php.ini:/usr/local/etc/php/conf.d/novaharvest.ini:ro
    environment:
      # credenciales del usuario de la aplicación
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    depends_on:
      # esperar a que mariadb esté preparada
      db:
        condition: service_healthy

  # servidor de bases de datos
  db:
    image: mariadb:11
    environment:
      # variables de inicialización de mariadb
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASS}
    volumes:
      # almacenamiento persistente
      - dbdata:/var/lib/mysql
    healthcheck:
      # comprobar la conexión y la inicialización de innodb
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  # administración de la base de datos desde el propio equipo
  adminer:
    image: adminer:5
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      db:
        condition: service_healthy

# volumen persistente administrado por docker
volumes:
  dbdata: